<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login administrativo | Bejiróó</title>
    <link rel="icon" type="image/png" href="../../public/imgs/logo-bejiroo.png" />
    <link rel="stylesheet" href="../../public/css/admin-login.css" />
  </head>
  <body class="auth-page admin-login-page">
    <header class="admin-login-nav">
      <div class="container">
        <a class="brand" href="../index.html">
          <span class="brand-mark"><img src="../../public/imgs/logo-bejiroo.png" alt="Logo Bejiróó" /></span>
          <span class="brand-name">BEJIRÓÓ</span>
        </a>
        <a class="admin-login-back" href="../index.html">Voltar ao site</a>
      </div>
    </header>

    <main class="admin-login-main">
      <div class="auth-layout">
        <section class="auth-side admin-side">
          <h2>PAINEL INTERNO</h2>
          <h1>Acesso administrativo</h1>
          <p class="sub">
            Entre com suas credenciais para gerenciar a loja.
          </p>
        </section>
        <section class="auth-form">
          <form data-admin-login>
            <div class="field">
              <label for="admin-cpf">CPF</label>
              <input id="admin-cpf" type="text" placeholder="Digite seu CPF" />
            </div>
            <div class="field">
              <label for="admin-email">E-mail</label>
              <input
                id="admin-email"
                type="email"
                placeholder="admin@admin"
                required
              />
            </div>
            <div class="field">
              <label for="admin-password">Senha</label>
              <div class="input-icon-wrap">
                <input
                  id="admin-password"
                  type="password"
                  placeholder="admin"
                  required
                />
                <button
                  type="button"
                  class="input-icon-right"
                  aria-label="Mostrar senha"
                  data-toggle-password="admin-password"
                >
                  👁
                </button>
              </div>
            </div>
            <p class="login-error" aria-live="polite"></p>
            <button class="button button-dark full" type="submit">Entrar</button>
          </form>
        </section>
      </div>
    </main>
    <div class="admin-login-wave" aria-hidden="true"></div>
    <script src="../../public/js/admin-login.js"></script>
  </body>
</html>
