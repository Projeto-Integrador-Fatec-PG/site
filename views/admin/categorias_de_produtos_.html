  <body class="categorias-page">
    <div class="admin-shell">
      <aside class="sidebar">
        <a class="brand" href="dashboard_.html"
          ><span class="brand-mark"><img src="../../public/imgs/logo.svg" alt="Logo Bejiróó" /></span><span>Bejiróó</span></a
        >
        <nav class="sidebar-nav">
          <a href="dashboard_.html">▣ Dashboard</a
          ><a href="gerenciar_produtos_.html">▢ Produtos</a
          ><a class="active" href="categorias_de_produtos_.html">◇ Categorias</a
          ><a href="lista_de_pedidos_.html">🛒 Pedidos</a
          ><a href="configuracoes_.html">⚙ Configurações</a>
        </nav>
      </aside>
      <main class="admin-main">
        <header class="admin-top">
          <h1>Categorias de Produtos</h1>
          <div class="admin-profile"><button class="admin-user admin-user-toggle" type="button" data-admin-menu-toggle>Administrador</button><div class="admin-user-menu" data-admin-menu hidden><a href="../index.html">Ir para o site</a><a href="configuracoes_.html">Configurações</a><button type="button" data-admin-logout>Sair</button></div></div>

        <div class="category-layout">
          <section class="panel">
            <h2>Categorias</h2>
            <div class="category-list">
              <div><span>⁝ Bolos</span><span>0</span></div>

            <h2>Nova Categoria</h2>
            <div class="image-placeholder" style="height: 110px">imagem</div>
            <div class="field">
              <label>Nome da Categoria</label
              ><input placeholder="Nome da categoria" />
            </div>
            <div class="field">
              <label>Descrição</label
              ><textarea placeholder="Descrição"></textarea>
            </div>
            <button class="button button-dark" data-demo-action>Salvar</button>
          </section>
        </div>
