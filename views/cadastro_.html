<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta | Bejiróó</title>
    <link rel="icon" type="image/svg+xml" href="../public/imgs/logo.svg" />
    <link rel="stylesheet" href="../public/css/login.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-form">
        <a class="brand" href="index.html">
          <span class="brand-mark"><img src="../public/imgs/logo.svg" alt="Logo Bejiróó" /></span>
          <span>BEJIRÓÓ</span>
        </a>
        <h1>Crie sua conta</h1>
        <p class="sub">Cadastre-se para acompanhar seus pedidos e favoritos</p>
        <form data-signup-form>
          <div class="field">
            <label for="name">Nome completo</label>
            <div class="input-icon-wrap">
              <span class="input-icon" aria-hidden="true">◉</span>
              <input id="name" type="text" placeholder="Digite seu nome" required minlength="3" autocomplete="name" />
            </div>
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <div class="input-icon-wrap">
              <span class="input-icon" aria-hidden="true">✉</span>
              <input id="email" type="email" placeholder="Digite seu e-mail" required autocomplete="email" />
            </div>
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <div class="input-icon-wrap">
              <span class="input-icon" aria-hidden="true">🔒</span>
              <input id="password" type="password" placeholder="Crie uma senha com 6 caracteres" required minlength="6" autocomplete="new-password" />
              <button type="button" class="input-icon-right" aria-label="Mostrar senha" data-toggle-password="password">👁</button>
            </div>
          </div>
          <div class="field">
            <label for="password-confirmation">Confirmar senha</label>
            <div class="input-icon-wrap">
              <span class="input-icon" aria-hidden="true">🔒</span>
              <input id="password-confirmation" type="password" placeholder="Repita sua senha" required minlength="6" autocomplete="new-password" />
              <button type="button" class="input-icon-right" aria-label="Mostrar senha" data-toggle-password="password-confirmation">👁</button>
            </div>
          </div>
          <button class="button button-dark full" type="submit">Criar conta</button>
          <p class="form-message" aria-live="polite"></p>
        </form>
        <p class="sub auth-switch">Já possui uma conta? <a class="text-link" href="login_.html">Entrar</a></p>
      </section>
      <section class="auth-side">
        <h2>Doces momentos<br /><em>começam aqui.</em></h2>
        <div class="image-placeholder">cupcake<br />+ brownie</div>
      </section>
    </main>
    <script src="../public/js/cadastro.js"></script>
  </body>
</html>
