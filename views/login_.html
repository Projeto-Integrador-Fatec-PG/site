<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Bejiróó</title>
    <link rel="icon" type="image/svg+xml" href="../public/imgs/logo.svg" />
    <link rel="stylesheet" href="../public/css/login.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-form">
        <a class="brand" href="index.html"
          ><span class="brand-mark"><img src="../public/imgs/logo.svg" alt="Logo Bejiróó" /></span
          ><span>BEJIRÓÓ</span></a
        >
        <h1>Bem-vindo de volta! 🍪</h1>
        <p class="sub">Faça login para acessar sua conta</p>
        <form>
          <div class="field">
            <label for="email">E-mail</label>
            <div class="input-icon-wrap">
              <span class="input-icon">✉</span>
              <input id="email" type="email" placeholder="Digite seu e-mail" required autocomplete="email" />
            </div>
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <div class="input-icon-wrap">
              <span class="input-icon">🔒</span>
              <input
                id="password"
                type="password"
                placeholder="Digite sua senha"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="input-icon-right"
                aria-label="Mostrar senha"
                data-toggle-password="password"
              >
                👁
              </button>
            </div>
          </div>
          <div class="form-footer">
            <label><input type="checkbox" /> Lembrar de mim</label>
            <a href="#">Esqueceu sua senha?</a>
          </div>
          <button class="button button-dark full" type="submit">Entrar</button>
          <p class="form-message" aria-live="polite"></p>
        </form>
        <div class="auth-divider">ou</div>
        <p class="sub">
          Não possui uma conta?
          <a class="text-link" href="cadastro_.html">Criar Conta</a>
        </p>
      </section>
      <section class="auth-side">
        <h2>Doces momentos<br /><em>começam aqui.</em></h2>
        <div class="image-placeholder">cupcake<br />+ brownie</div>
      </section>
    </main>
    <script src="../public/js/app.js"></script>
    <script src="../public/js/login.js"></script>
  </body>
</html>
