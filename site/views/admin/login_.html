<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login administrativo | Bejiróó</title>
    <link rel="stylesheet" href="../../public/css/admin-login.css" />
  </head>
  <body class="auth-page admin-login-page">
    <main class="auth-layout">
      <section class="auth-form">
        <a class="brand" href="../index.html">
          <span class="brand-mark"><img src="../../public/imgs/logo.png" alt="Logo Bejiróó" /></span> BEJIRÓÓ
        </a>
        <h1>Acesso administrativo</h1>
        <p class="sub">Entre para gerenciar sua confeitaria</p>
        <form data-admin-login>
          <div class="field">
            <label for="admin-email">E-mail</label>
            <input
              id="admin-email"
              type="email"
              placeholder="Digite seu e-mail"
              required
            />
          </div>
          <div class="field">
            <label for="admin-password">Senha</label>
            <input
              id="admin-password"
              type="password"
              placeholder="Digite sua senha"
              required
            />
          </div>
          <p class="login-error" aria-live="polite"></p>
          <button class="button button-dark full" type="submit">
            Entrar no painel
          </button>
        </form>
      </section>
      <section class="auth-side">
        <h2>Painel<br /><em>Bejiróó</em></h2>
        <div class="image-placeholder">gestão<br />de doces</div>
      </section>
    </main>
    <script src="../../public/js/admin-login.js"></script>
  </body>
</html>
