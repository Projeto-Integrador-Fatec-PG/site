<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brownie com Brigadeiro | Bejiróó</title>
    <link rel="stylesheet" href="../public/css/produto.css" />
  </head>
  <body class="site-page produto-page">
    <div data-site-header></div>
    <main class="container detail">
      <div class="breadcrumb">Home → Cardápio → Brownie com Brigadeiro</div>
      <section class="detail-grid">
        <div class="detail-image image-placeholder">
          brownie com<br />brigadeiro
        </div>
        <div class="detail-copy">
          <h1>Brownie com Brigadeiro</h1>
          <p>
            Nosso brownie tradicional com cobertura cremosa de brigadeiro e
            granulado.
          </p>
          <div class="price">R$ 12,90</div>
          <strong>Sabor</strong>
          <div class="choice">
            <button class="selected">Tradicional</button
            ><button>Chocolate Branco</button>
          </div>
          <strong>Quantidade</strong>
          <div class="quantity" aria-label="Quantidade do produto">
            <button type="button" data-quantity-action="decrease" aria-label="Diminuir quantidade">−</button>
            <span data-quantity-value aria-live="polite">1</span>
            <button type="button" data-quantity-action="increase" aria-label="Aumentar quantidade">+</button>
          </div>
          <button class="button button-dark full" data-demo-action>
            🛒 Adicionar ao carrinho
          </button>
        </div>
      </section>
    </main>
    <script src="../public/js/app.js"></script>
    <script src="../public/js/produto.js"></script>
  </body>
</html>
