<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Bejiróó</title>
    <link rel="stylesheet" href="../public/css/login.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-form">
        <a class="brand" href="index.html"
          ><span class="brand-mark"><img src="../public/imgs/logo.png" alt="Logo Bejiróó" /></span> BEJIRÓÓ</a
        >
        <h1>Bem-vindo de volta!</h1>
        <p class="sub">Faça login para acessar sua conta</p>
        <form>
          <div class="field">
            <label for="email">E-mail</label
            ><input id="email" type="text" placeholder="Digite seu e-mail" />
          </div>
          <div class="field">
            <label for="password">Senha</label
            ><input
              id="password"
              type="password"
              placeholder="Digite sua senha"
            />
          </div>
          <label><input type="checkbox" /> Lembrar de mim</label
          ><button class="button button-dark full" type="submit">Entrar</button>
        </form>
        <p class="sub">
          ou<br /><br />Não possui uma conta?
          <a class="text-link" href="#">Criar Conta</a>
        </p>
      </section>
      <section class="auth-side">
        <h2>Doces momentos<br /><em>começam aqui...</em></h2>
        <div class="image-placeholder">cupcake<br />+ brownie</div>
      </section>
    </main>
    <script src="../public/js/app.js"></script>
    <script src="../public/js/login.js"></script>
  </body>
</html>
